# =====================================================================
#  KEEPALIVED - SERVER 1 - MASTER  (10.79.5.86)
#  Ubicación: /etc/keepalived/keepalived.conf
#
#  Orden de control de la IP virtual 10.79.7.200:
#     SERVER1 (prio 150)  ->  SERVER2 (prio 120)  ->  SERVER3 (prio 100)
#  Cuando el MASTER vuelve, RECUPERA la IP (preempt, activo por defecto).
#
#  Revisar el nombre de la interfaz con:  ip a   (enp0s3, eth0, ens33...)
# =====================================================================
global_defs {
    router_id FARMACIA_SERVER1
    enable_script_security
    script_user root
}

# Si Nginx muere, baja la prioridad 60 puntos (150 -> 90): pierde la IP
vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2
    timeout 3
    fall 2
    rise 2
    weight -60
}

vrrp_instance VI_FARMACIA {
    state MASTER
    interface enp0s3
    virtual_router_id 53          # IGUAL en los 3 nodos (Grupo 3 -> 53)
    priority 150
    advert_int 1
    # preempt (por defecto): si este nodo vuelve, recupera el control

    authentication {
        auth_type PASS
        auth_pass farm3g          # máx. 8 caracteres, igual en los 3 nodos
    }

    unicast_src_ip 10.79.5.86
    unicast_peer {
        10.79.4.177
        10.79.7.16
    }

    virtual_ipaddress {
        10.79.7.200/22 dev enp0s3 label enp0s3:vip
    }

    track_script {
        chk_nginx
    }
}
