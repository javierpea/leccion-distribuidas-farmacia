# =====================================================================
#  KEEPALIVED - SERVER 3 - ESCLAVO 2 / BACKUP  (10.79.7.16)
#  Toma la IP virtual si caen el MASTER y el ESCLAVO 1.
# =====================================================================
global_defs {
    router_id FARMACIA_SERVER3
    enable_script_security
    script_user root
}

vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2
    timeout 3
    fall 2
    rise 2
    weight -60
}

vrrp_instance VI_FARMACIA {
    state BACKUP
    interface enp0s3
    virtual_router_id 53
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass farm3g
    }

    unicast_src_ip 10.79.7.16
    unicast_peer {
        10.79.5.86
        10.79.4.177
    }

    virtual_ipaddress {
        10.79.7.200/22 dev enp0s3 label enp0s3:vip
    }

    track_script {
        chk_nginx
    }
}
