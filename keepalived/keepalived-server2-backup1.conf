# =====================================================================
#  ARCHIVO GENERADO por aplicar_ips.py a partir de plantillas/. Para
#  cambiar IPs o puertos edite ips.env y ejecute: python aplicar_ips.py
#
#  KEEPALIVED - FARMACIA SERVER2 ESCLAVO1  (PC Windows 10.79.16.19)
#  Se instala en la VM UBUNTU (VirtualBox, adaptador PUENTE) que corre
#  dentro de la PC Windows. Keepalived NO existe para Windows.
#  Ubicación (en la VM): /etc/keepalived/keepalived.conf
#
#  IP virtual: 10.79.7.200   (los clientes usan http://10.79.7.200:90)
#
#  Prioridades:  MASTER 120  >  ESCLAVO 1 110  >  ESCLAVO 2 100
#  Si NGINX falla en un nodo, chk_nginx le resta 50:
#     MASTER 120->70 · ESCLAVO1 110->60 · ESCLAVO2 100->50
#  => Cualquier nodo con NGINX sano (>=100) siempre gana a uno caído (<=70).
#
#  - Cae el MASTER          -> toma el control el ESCLAVO 1 (110)
#  - Cae también ESCLAVO 1  -> toma el control el ESCLAVO 2 (100)
#  - Vuelve el MASTER       -> RECUPERA el control siempre (preempt, que
#    viene activo por defecto: NO poner "nopreempt").
#
#  ESCLAVO 1: toma la IP virtual si cae el MASTER.
#  Revisar el nombre de la interfaz con:  ip a   (enp0s3, eth0, ens33...)
# =====================================================================
global_defs {
    router_id FARMACIA_SERVER2_ESCLAVO1
    enable_script_security
}

vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    user root
    interval 2
    fall 2
    rise 2
    weight -50
}

vrrp_instance VI_1 {
    state BACKUP
    interface enp0s3
    virtual_router_id 51          # IGUAL en los 3 nodos
    priority 110
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass 1234            # IGUAL en los 3 nodos
    }

    # Anuncios VRRP por multicast (igual que en el PDF): no hace falta
    # poner las IPs de las VMs. Si la red de la U bloquea multicast y la IP
    # nunca cambia de nodo, descomentar y poner las IPs PUENTE de las VMs:
    # unicast_src_ip  IP_DE_ESTA_VM
    # unicast_peer {
    #     IP_VM_OTRO_1
    #     IP_VM_OTRO_2
    # }

    virtual_ipaddress {
        10.79.7.200/22
    }

    track_script {
        chk_nginx
    }
}
