# =====================================================================
#  NGINX - Balanceador de carga (MISMO archivo en los 3 servidores)
#  Ubicación:  /etc/nginx/conf.d/farmacia.conf
#  Probar:     sudo nginx -t && sudo systemctl reload nginx
#
#  El cliente Flutter (10.79.7.180) SOLO conoce la IP virtual 10.79.7.200.
#  Keepalived decide qué Nginx (server1, 2 o 3) tiene esa IP en cada momento,
#  y ese Nginx reparte entre los dos Flask.
# =====================================================================

upstream farmacia_api {
    # least_conn: manda la petición al servidor con menos conexiones.
    # (Para la demo de "turnos" exactos 5000/5001 se puede quitar y queda
    #  round-robin por defecto.)
    least_conn;

    # Server 1 (MASTER) corre Flask :5000, Server 2 (ESCLAVO 1) corre Flask :5001
    server 10.79.5.86:5000  max_fails=3 fail_timeout=10s;
    server 10.79.4.177:5001 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

# Límite básico anti-abuso: 50 peticiones/seg por IP (ráfagas de 100)
limit_req_zone $binary_remote_addr zone=api_limite:10m rate=50r/s;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 16k;

    # Muestra qué backend respondió (útil para la exposición)
    add_header X-Balanceador $hostname always;
    add_header X-Upstream $upstream_addr always;

    location /api/ {
        limit_req zone=api_limite burst=100 nodelay;
        limit_req_status 429;   # no usar 503 (la app lo interpreta como mantenimiento)

        proxy_pass http://farmacia_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;

        # Si un Flask está caído, reintenta en el otro.
        # OJO: solo reintenta GET/PUT/DELETE (idempotentes). Un POST o
        # PATCH NO se reenvía para no crear/descontar dos veces.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        # Si los DOS Flask están caídos -> JSON de mantenimiento (503)
        error_page 502 503 504 = @mantenimiento;
    }

    location @mantenimiento {
        default_type application/json;
        add_header X-Server "nginx-$hostname" always;
        return 503 '{"error":"Sistema en mantenimiento","motivo":"mantenimiento","servidor":"nginx"}';
    }

    # Para el chequeo de Keepalived (no pasa por Flask)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
