# =====================================================================
#  NGINX - Balanceador de carga (MISMO archivo en los 3 servidores)
#  Basado en la Unidad 2 - Práctica Integradora (NGINX en Docker).
#
#  Se monta en el contenedor:  ./nginx.conf:/etc/nginx/nginx.conf:ro
#  Puerto: el contenedor escucha 8080 y se publica en el host como 90.
#
#  El cliente Flutter SOLO conoce la IP virtual:  http://10.79.7.200:90
#  Keepalived decide qué servidor (1, 2 o 3) tiene la IP virtual y el
#  NGINX de ese servidor reparte las peticiones entre las 6 APIs
#  (puertos 5000 y 5001 de cada uno de los 3 servidores).
# =====================================================================

events {}

http {

    # ---- La API corre en los 3 servidores, en los puertos 5000 y 5001 ----
    # 6 instancias en total. Round-robin por defecto (igual que en el PDF):
    # cada petición va a la siguiente instancia de la lista.
    # max_fails/fail_timeout: si una instancia no responde, NGINX la saca 10 s
    # (si un PC se apaga, sus dos APIs salen y siguen las otras cuatro).
    upstream backend_api {
        # Server 1 - MASTER
        server 10.79.5.86:5000  max_fails=3 fail_timeout=10s;
        server 10.79.5.86:5001  max_fails=3 fail_timeout=10s;
        # Server 2 - ESCLAVO 1
        server 10.79.4.177:5000 max_fails=3 fail_timeout=10s;
        server 10.79.4.177:5001 max_fails=3 fail_timeout=10s;
        # Server 3 - ESCLAVO 2
        server 10.79.7.16:5000  max_fails=3 fail_timeout=10s;
        server 10.79.7.16:5001  max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;

        # Muestra qué API respondió (útil para la exposición)
        add_header X-Balanceador $hostname always;
        add_header X-Upstream    $upstream_addr always;

        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;

            # Si una API está caída, reintenta en la siguiente.
            # (NGINX no reenvía POST/PATCH: así no se crea/descuenta dos veces)
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;

            # Si TODAS las APIs están caídas -> JSON de mantenimiento (503)
            error_page 502 503 504 = @mantenimiento;
        }

        location @mantenimiento {
            default_type application/json;
            return 503 '{"error":"Sistema en mantenimiento","motivo":"mantenimiento","servidor":"nginx"}';
        }

        # Health check que usa Keepalived (check_nginx.sh). No pasa por Flask.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }
    }
}
