# =====================================================================
#  ARCHIVO GENERADO por aplicar_ips.py a partir de plantillas/. Para
#  cambiar IPs o puertos edite ips.env y ejecute: python aplicar_ips.py
#
#  NGINX - Balanceador de carga (MISMO archivo en los 3 servidores)
#  Basado en la Unidad 2 - Práctica Integradora (NGINX en Docker).
#
#  Se monta en el contenedor:  ./nginx.conf:/etc/nginx/nginx.conf:ro
#  Puerto: el contenedor escucha 8080 y se publica en el host como 90.
#
#  El cliente Flutter SOLO conoce la IP virtual:  http://10.79.31.240:90
#  Keepalived decide qué servidor (1, 2 o 3) tiene la IP virtual y el
#  NGINX de ese servidor reparte las peticiones entre las 2 APIs:
#  10.79.28.49:5000 (entorno 1) y 10.79.24.202:5001 (entorno 2).
# =====================================================================

events {}

http {

    # ---- Dos entornos independientes de la API ----
    #   Entorno 1: 10.79.28.49 -> puerto 5000
    #   Entorno 2: 10.79.24.202 -> puerto 5001
    # Ambas usan la MISMA BD (SQL Server Express del cliente).
    # Round-robin por defecto: una petición a cada entorno.
    # max_fails/fail_timeout: si un entorno no responde, NGINX lo saca 10 s
    # y manda todo al otro.
    upstream backend_api {
        server 10.79.28.49:5000 max_fails=3 fail_timeout=10s;   # Entorno 1
        server 10.79.24.202:5001 max_fails=3 fail_timeout=10s;   # Entorno 2
    }

    server {
        listen 8080;

        # Muestra qué API respondió (útil para la exposición)
        add_header X-Balanceador $hostname always;
        add_header X-Upstream    $upstream_addr always;
        # Qué servidor atendió: master | esclavo1 | esclavo2 (la app lo muestra)
        add_header X-Nodo        $hostname always;
        # La app web (Chrome) solo puede leer las cabeceras que se exponen
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Expose-Headers "X-Server, X-Nodo, X-Upstream" always;

        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # El token (Authorization: Bearer ...) pasa tal cual a la API
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 3s;
            # 60 s: en la demo de concurrencia las peticiones esperan su turno (bloqueo de fila)
            proxy_read_timeout 60s;

            # Si una API está caída, reintenta en la otra.
            # (NGINX no reenvía POST/PATCH: así no se crea/descuenta dos veces)
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;

            # Si TODAS las APIs están caídas -> JSON de mantenimiento (503)
            error_page 502 503 504 = @mantenimiento;
        }

        location @mantenimiento {
            default_type application/json;
            return 503 '{"error":"Sistema en mantenimiento","motivo":"mantenimiento","servidor":"nginx"}';
        }

        # Health check que usa Keepalived (check_nginx.sh). No pasa por Flask.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }
    }
}
